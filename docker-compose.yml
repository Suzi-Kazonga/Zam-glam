services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: zamglam_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-zamglam_db}
      MYSQL_USER: ${DB_USER:-zamglam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zamglam_pass}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - zamglam_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-zamglam_user}", "-p${DB_PASSWORD:-zamglam_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zamglam_backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-zamglam_user}
      DB_PASSWORD: ${DB_PASSWORD:-zamglam_pass}
      DB_NAME: ${DB_NAME:-zamglam_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - zamglam_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zamglam_frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - zamglam_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Python Courier Service (Microservice)
  courier_service:
    build:
      context: .
      dockerfile: courier-service/Dockerfile
    container_name: zamglam_courier_service
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: app.py
      PORT: ${COURIER_PORT:-5001}
    ports:
      - "${COURIER_PORT:-5001}:5001"
    networks:
      - zamglam_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional: PhpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: zamglam_phpmyadmin
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_USER: ${DB_USER:-zamglam_user}
      PMA_PASSWORD: ${DB_PASSWORD:-zamglam_pass}
      PMA_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - zamglam_network
    restart: unless-stopped

networks:
  zamglam_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
