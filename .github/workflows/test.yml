name: Run Tests

# The repository's default branch is master. This previously listened only for "main",
# so it never ran on a push here.
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # There is no package.json at the repository root; the backend is its own package.
    # Running npm at the root is what made this workflow fail every time.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A build failure catches broken imports and syntax errors that the backend
      # tests cannot see.
      - name: Build
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --runInBand
